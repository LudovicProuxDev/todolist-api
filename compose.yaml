services:
  # Backend
  backend:
    #image: todolist-api-backend
    build: ./backend
    container_name: todolist-api-backend
    command: >
      sh -c "composer install && 
             php bin/console doctrine:database:create --if-not-exists && 
             php bin/console doctrine:migrations:migrate --no-interaction && 
             php -S 0.0.0.0:8000 -t public"
    ports:
      - "8000:8000"
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      DATABASE_URL: "postgresql://root:secret@db:5432/todolist?serverVersion=18&charset=utf8"
    depends_on:
      - db
    networks:
      - todolist-app

  # Database
  db:
    image: postgres:18-alpine
    container_name: todolist-api-db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: todolist
    volumes:
      - todolist-db-data:/var/lib/postgresql/data
    networks:
      - todolist-app
    ports:
      - "5432:5432"

  # Frontend
  frontend:
    #image: todolist-api-frontend
    build: ./frontend
    container_name: todolist-api-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    networks:
      - todolist-app

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: todolist-api-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - todolist-prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    networks:
      - todolist-app

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: todolist-api-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=GFtodolistAdmin00+
    volumes:
      - todolist-grafana-data:/var/lib/grafana
    networks:
      - todolist-app

  # SonarQube
  sonarqube:
    image: sonarqube:community
    container_name: todolist-api-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
      - SONAR_JDBC_URL=jdbc:postgresql://sonar_db:5432/sonar
    depends_on:
      - sonar_db
    networks:
      - todolist-app

  # SonarQube Database
  sonar_db:
    image: postgres:15-alpine
    container_name: todolist-api-sonar-db
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    volumes:
      - todolist-sonar-db-data:/var/lib/postgresql/data
    networks:
      - todolist-app

networks:
  todolist-app:
    driver: bridge

volumes:
  todolist-db-data:
  todolist-prometheus-data:
  todolist-grafana-data:
  todolist-sonar-db-data:
