name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  # Secrets
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan secrets via Gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --no-banner --redact --verbose
          --gitleaks-ignore-path /repo/.gitleaksignore

  # Backend
  backend-build:
    needs: secrets-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@2cb9b829437ee246e9b3cac53555a39208ca6d28
        with:
          php-version: "8.4"
          extensions: pdo_pgsql
      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: ./backend/vendor
          key: ${{ runner.os }}-php-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Check vulnerabilities via Composer audit
        run: composer audit
      - name: Check coding standards via PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: Run static analysis via PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  backend-test:
    needs: backend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      DATABASE_URL: postgres://john:doe@localhost:5432/todolist?serverVersion=16&charset=utf8
      JWT_SECRET_KEY: "${{ secrets.JWT_SECRET_KEY }}"
      JWT_PUBLIC_KEY: "${{ secrets.JWT_PUBLIC_KEY }}"
      JWT_PASSPHRASE: ${{ secrets.JWT_PASSPHRASE }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: todolist
          POSTGRES_USER: john
          POSTGRES_PASSWORD: doe
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U symfony"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@2cb9b829437ee246e9b3cac53555a39208ca6d28
        with:
          php-version: "8.4"
          extensions: pdo_pgsql
      - name: Cache Composer packages
        id: composer-cache-test
        uses: actions/cache@v3
        with:
          path: ./backend/vendor
          key: ${{ runner.os }}-php-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-
      - name: Copy .env.test.local
        run: php -r "file_exists('.env.test.local') || copy('.env.test', '.env.test.local');"
      - name: Create Database
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test --no-interaction
      - name: Execute tests via PHPUnit
        run: vendor/bin/phpunit --log-junit reports/phpunit.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend/reports/

  # Frontend
  frontend-build:
    needs: secrets-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Cache node_modules
        id: node-cache
        uses: actions/cache@v3
        with:
          path: ./frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check vulnerabilities via npm audit
        run: npm audit

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/

  frontend-test:
    needs: frontend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Cache node_modules
        id: node-cache
        uses: actions/cache@v3
        with:
          path: ./frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest -u --run --reporter=default --reporter=junit --outputFile.junit=reports/vitest.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-report
          path: frontend/reports/

  # Docker images
  docker:
    needs: [backend-build, backend-test, frontend-build, frontend-test]
    runs-on: ubuntu-latest
    env:
      TRIVY: >-
        docker run --rm
        -v /var/run/docker.sock:/var/run/docker.sock
        -v trivy-cache:/root/.cache
        -v ${{ github.workspace }}/reports:/reports
        aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t todolist-api-backend ./backend

      - name: Build frontend image
        run: docker build -t todolist-api-frontend ./frontend

      - name: Generate Trivy reports
        run: |
          mkdir -p reports
          $TRIVY image --quiet --scanners vuln --output /reports/trivy-backend.txt todolist-api-backend
          $TRIVY image --quiet --scanners vuln --output /reports/trivy-frontend.txt todolist-api-frontend

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-reports
          path: reports/

      - name: Scan backend image via Trivy
        run: $TRIVY image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 todolist-api-backend

      - name: Scan frontend image via Trivy
        run: $TRIVY image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 todolist-api-frontend

      - name: Create compose secrets
        run: |
          for var in POSTGRES_PASSWORD APP_DB_PASSWORD TEST_DB_PASSWORD GRAFANA_ADMIN_PASSWORD SONAR_DB_PASSWORD; do
            echo "$var=$(openssl rand -hex 16)" >> .env
          done
          source .env
          echo "DATABASE_URL=\"postgresql://todolist_app:$APP_DB_PASSWORD@db:5432/todolist?serverVersion=16&charset=utf8\"" > backend/.env.local

      - name: Validate compose file
        run: docker compose config -q

      - name: Start database
        run: |
          docker compose up -d db
          for i in $(seq 1 30); do
            docker compose exec -T db pg_isready -U root -d todolist && exit 0
            sleep 2
          done
          exit 1

      - name: Start backend
        run: docker compose up -d --build backend

      - name: Check backend is responding
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8000/api && exit 0
            sleep 5
          done
          exit 1

      - name: Install frontend dependencies
        run: docker compose run --rm --no-deps frontend npm ci

      - name: Start frontend
        run: docker compose up -d --no-deps frontend

      - name: Check frontend is responding
        run: |
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/ && exit 0
            sleep 2
          done
          exit 1

      - name: Check frontend can reach backend
        run: curl -sf -o /dev/null http://localhost:3000/api

      - name: Show logs on failure
        if: failure()
        run: docker compose logs db backend frontend

      - name: Stop containers
        if: always()
        run: docker compose down -v
